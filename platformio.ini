[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Required for OTA: two app slots instead of the single huge_app slot of the board default.
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
  -DCORE_DEBUG_LEVEL=1

; Wireless upload: connect the PC to the ESP32-CAM-AI access point, then run this env.
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
  --port=3232
  --auth=esp32cam-ota
